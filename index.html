const ICONS = {
  cup: '<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M7 3.5c0 1-1 1-1 2s1 1 1 2M11 3.5c0 1-1 1-1 2s1 1 1 2"/>',
  waffle: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 8h17M3.5 13h17M3.5 18h17M8 3.5v17M13 3.5v17M18 3.5v17"/>',
  cake: '<path d="M3 20h18v-6a9 9 0 0 0-18 0v6Z"/><path d="M3 20h18v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-1Z"/><path d="M12 8V4M9 4c0-1 1-1 1-2M15 4c0 1-1 1-1 2"/>',
  penguin: '<ellipse cx="12" cy="14" rx="7" ry="8"/><ellipse cx="12" cy="15.5" rx="4" ry="5.5"/><circle cx="9.3" cy="10.5" r="1"/><circle cx="14.7" cy="10.5" r="1"/><path d="M12 12.5c1 0 1.4.6 1.4 1s-.6 1-1.4 1-1.4-.4-1.4-1 .4-1 1.4-1Z"/>'
};

function fmt(n){
  if (n === null || n === undefined || n === "") return "—";
  return `${n} ${CURRENCY}`;
}

function iconSVG(key){
  return `<svg viewBox="0 0 24 24" class="cat-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[key] || ICONS.waffle}</svg>`;
}

// Categories 1–7 render in the top tab row, the rest in the bottom row.
const ROW_SPLIT = 7;

function renderTabs(){
  const row1 = document.getElementById('tabs-row-1');
  const row2 = document.getElementById('tabs-row-2');

  MENU.forEach((cat, i) => {
    const target = i < ROW_SPLIT ? row1 : row2;
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.dataset.target = cat.id;
    btn.innerHTML = `${iconSVG(cat.icon)}<span>${cat.title}</span>`;
    target.appendChild(btn);
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
      document.querySelectorAll('.category').forEach(sec => sec.classList.remove('visible'));
      document.getElementById('cat-' + btn.dataset.target).classList.add('visible');
    });
  });
}

function renderCategory(cat, index){
  const isDrinkTable = !!cat.keys;

  let itemsHTML;
  if (isDrinkTable){
    itemsHTML = `
      <div class="drink-head">
        <span></span><span>${cat.columns[0]}</span><span>${cat.columns[1]}</span>
      </div>
      ${cat.items.map(it => `
        <div class="drink-row">
          <div class="item-name">${it.name}${it.note ? `<span class="note">${it.note}</span>` : ''}</div>
          <div class="price">${fmt(it[cat.keys[0]])}</div>
          <div class="price">${fmt(it[cat.keys[1]])}</div>
        </div>
      `).join('')}
    `;
  } else {
    itemsHTML = cat.items.map(it => `
      <div class="item-row">
        <div class="item-name">${it.name}${it.note ? `<span class="note">${it.note}</span>` : ''}</div>
        <div class="dots"></div>
        <div class="price">${fmt(it.price)}</div>
      </div>
    `).join('');
  }

  const addonsHTML = cat.addons ? `
    <div class="addons">
      ${cat.addons.map(a => `<span>${a.name} <strong>+${a.price}</strong></span>`).join('<i class="sep">•</i>')}
    </div>` : '';

  return `
    <section class="category ${index === 0 ? 'visible' : ''}" id="cat-${cat.id}">
      <div class="cat-card">
        <div class="cat-title">
          ${iconSVG(cat.icon)}
          <h2>${cat.title}</h2>
        </div>
        ${cat.subtitle ? `<p class="cat-subtitle">${cat.subtitle}</p>` : ''}
        <div class="items">${itemsHTML}</div>
        ${addonsHTML}
      </div>
    </section>
  `;
}

function renderMenu(){
  document.getElementById('menu').innerHTML = MENU.map(renderCategory).join('');
}

renderMenu();
